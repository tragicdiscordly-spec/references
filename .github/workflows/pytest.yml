name: pytest

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # BeeRef-hidden.cmd launches Python 3.10, 3.11 or 3.12.
        python-version: ["3.10", "3.11", "3.12"]
        pyqt-version: ["6.7.0"]
    env:
      # Same headless mode as the local validation in agent.md.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libfontconfig1 libxkbcommon0 libdbus-1-3
          python -m pip install --upgrade pip
          pip install .
          # We want to test against installed package instead of source files
          pip install . --target beeref_inst
          rm -r beeref
          mv beeref_inst/beeref beeref
          rm -r beeref_inst
          pip install -r requirements/test.txt
          pip install pyQt6==${{ matrix.pyqt-version }} pyQt6-Qt6==${{ matrix.pyqt-version }} --upgrade
      - name: Run Unittests with pytest
        run: pytest
